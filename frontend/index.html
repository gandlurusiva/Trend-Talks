<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Talks Shopping</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f4f4;
        }

        header{
            background:black;
            color:white;
            padding:15px;
            text-align:center;
        }

        .products{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:40px;
            flex-wrap:wrap;
        }

        .card{
            background:white;
            width:250px;
            padding:15px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            text-align:center;
        }

        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
            border-radius:10px;
        }

        button{
            background:black;
            color:white;
            border:none;
            padding:10px 20px;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:orange;
        }

        #cartCount{
            color:yellow;
            font-size:20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Trend Talks Shopping</h1>
        <h3>Cart Items : <span id="cartCount">0</span></h3>
    </header>

    <div class="products">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt="">
            <h2>T-Shirt</h2>
            <h3>₹799</h3>
            <button onclick="addToCart()">Add To Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="">
            <h2>Shoes</h2>
            <h3>₹1999</h3>
            <button onclick="addToCart()">Add To Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=500" alt="">
            <h2>Hoodie</h2>
            <h3>₹1499</h3>
            <button onclick="addToCart()">Add To Cart</button>
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
