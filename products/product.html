<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Trend Talks</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f4f4;
        }

        h1{
            text-align:center;
            padding:20px;
            background:black;
            color:white;
        }

        .container{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
            margin-top:40px;
        }

        .product-card{
            background:white;
            width:250px;
            padding:15px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            text-align:center;
        }

        .product-card img{
            width:100%;
            height:220px;
            object-fit:cover;
            border-radius:10px;
        }

        button{
            padding:10px 20px;
            background:black;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:orange;
        }
    </style>
</head>

<body>

    <h1>Trend Talks Products</h1>

    <div class="container">

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-152157
